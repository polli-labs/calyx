name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  publish:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@^11.5.1
      - run: npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The publish set is derived from the workspace, not listed here: see
      # scripts/release-plan.mjs. A hand-kept list here and a `workspace:*`
      # dependency graph in the manifests cannot be reconciled by anything that
      # runs before a consumer's failed install.
      - name: Require gated closure dependencies on the registry
        run: |
          set -euo pipefail
          node scripts/release-plan.mjs --gated-dependencies > gated-dependencies.txt
          while read -r package_name; do
            npm view "${package_name}" name --registry https://registry.npmjs.org
          done < gated-dependencies.txt
      - name: Publish the tagged release closure
        run: |
          set -euo pipefail
          node scripts/release-plan.mjs > release-plan.txt
          cat release-plan.txt
          while read -r package_name; do
            pnpm --filter "${package_name}" publish --no-git-checks --access public --provenance
          done < release-plan.txt
        env:
          NODE_AUTH_TOKEN: ""
