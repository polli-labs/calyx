name: release-client

on:
  workflow_dispatch:
    inputs:
      expected_public_sha:
        description: Exact public release-mirror SHA to publish
        required: true
        type: string
      expected_source_sha:
        description: Exact reviewed calyx-dev SHA mirrored by the public commit
        required: true
        type: string
      expected_version:
        description: Exact @polli-labs/calyx-client package version
        required: true
        type: string
      bootstrap:
        description: Use the NPM_TOKEN secret for the first package version only
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-client
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-client-release
    steps:
      - uses: actions/checkout@v6
      - name: Verify repository, branch, source mapping, and package identity
        env:
          EXPECTED_PUBLIC_SHA: ${{ inputs.expected_public_sha }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "polli-labs/calyx"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$EXPECTED_PUBLIC_SHA"
          test "$(git log -1 --format='%(trailers:key=Source-SHA,valueonly)' | tr -d '\n')" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse HEAD:packages/client)" = "$(git log -1 --format='%(trailers:key=Source-Path-Tree,valueonly)' | tr -d '\n')"
          test "$(node -p "require('./packages/client/package.json').version")" = "$EXPECTED_VERSION"
          test "$(node -p "require('./packages/client/package.json').repository.url")" = "https://github.com/polli-labs/calyx"
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Install provenance-capable npm
        run: npm install --global npm@11.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Preview the exact package inventory
        run: npm pack --dry-run --json ./packages/client
      - name: Publish @polli-labs/calyx-client with provenance
        run: pnpm --filter @polli-labs/calyx-client publish --no-git-checks --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ inputs.bootstrap && secrets.NPM_TOKEN || '' }}
