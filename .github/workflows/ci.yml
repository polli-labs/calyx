name: ci

# Disabled on public mirror — CI runs on calyx-dev (private).
# Re-enable if external contributors start submitting PRs.
# See: polli-labs/calyx-dev/.github/workflows/ci.yml
on:
  workflow_dispatch:  # manual trigger only, for emergencies

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
