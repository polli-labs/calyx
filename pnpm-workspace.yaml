packages:
  - packages/*
  - examples/*
  - examples/extensions/*

# Supply-chain posture (POL-1265 / POL-1747): block dependency versions
# published less than 7 days ago on any resolution; frozen-lockfile installs
# are unaffected. Exceptions go in minimumReleaseAgeExclude with exact pins.
minimumReleaseAge: 10080

# Security pins must live in pnpm-workspace.yaml for pnpm 10+; pnpm 11 ignores
# package.json#pnpm.overrides entirely.
overrides:
  "@protobufjs/utf8@1.1.0": 1.1.1
  brace-expansion@1.1.12: 1.1.13
  brace-expansion@5.0.4: 5.0.6
  flatted@3.3.3: 3.4.2
  picomatch@4.0.3: 4.0.4
  postcss@8.5.6: 8.5.15
  protobufjs@7.5.6: 7.5.8
  protobufjs@8.0.1: 8.5.0
  vite@5.4.21: 7.3.5
  ws@8.20.0: 8.21.0

# Dependency lifecycle scripts stay disabled (pnpm 10 default; these three
# ship install scripts but work through prebuilt/pure-JS fallbacks, as all
# current builds already prove). strictDepBuilds turns any future unreviewed
# script-bearing dependency into an install failure instead of a warning.
strictDepBuilds: true
ignoredBuiltDependencies:
  - "@google/genai"
  - esbuild
  - protobufjs
